<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics — AsheFlow</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/app-shell.css" />
</head>
<body>

<div class="app">
  <div id="sidebarRoot"></div>
  <div class="main">
    <div id="topbarRoot"></div>
    <div class="view active">
      <div class="view-head">
        <div><h1>Analytics</h1><p>Revenue, engagement, growth, and retention at a glance.</p></div>
        <div class="filter-chips" style="margin-bottom:0;" data-chip-group>
          <span class="chip" data-range="7d">7D</span>
          <span class="chip active" data-range="30d">30D</span>
          <span class="chip" data-range="90d">90D</span>
        </div>
      </div>

      <div class="grid-4" style="margin-bottom:1.2rem;">
        <div class="card"><div class="metric-label">Revenue</div><div class="metric-value">$18,420<span class="metric-up">▲ 24%</span></div></div>
        <div class="card"><div class="metric-label">New Fans</div><div class="metric-value">312<span class="metric-up">▲ 12%</span></div></div>
        <div class="card"><div class="metric-label">Messages Sent</div><div class="metric-value">8,904<span class="metric-up">▲ 9%</span></div></div>
        <div class="card"><div class="metric-label">Churn Rate</div><div class="metric-value">2.4%<span class="metric-down">▼ 0.6%</span></div></div>
      </div>

      <div id="chartGrid" class="grid-2-even"></div>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/shell.js"></script>
<script>
  AsheShell.mount({ active:'analytics' });

  const D = window.ASHEFLOW_DATA;
  const charts = [
    {key:'revenue', label:'Revenue', cls:''},
    {key:'growth', label:'Growth', cls:''},
    {key:'fans', label:'Fans', cls:'cyan'},
    {key:'messages', label:'Messages', cls:'cyan'},
    {key:'automation', label:'Automation', cls:'pink'},
    {key:'engagement', label:'Engagement', cls:''},
    {key:'retention', label:'Retention', cls:'pink'},
  ];

  document.getElementById('chartGrid').innerHTML = charts.map(c=>`
    <div class="card">
      <div class="card-title">${c.label}</div>
      <div class="chart-bars ${c.cls}">${D.analyticsSeries[c.key].map(h=>`<div style="height:${h}%"></div>`).join('')}</div>
    </div>
  `).join('');

  document.querySelectorAll('[data-chip-group] .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      AsheToast.show({type:'info', title:'Range updated', body:'Showing data for ' + chip.textContent});
    });
  });
</script>
<script src="assets/js/copilot.js" data-context="dashboard"></script>
</body>
</html>
