<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prompt Library — AsheFlow</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/app-shell.css" />
</head>
<body>

<div class="app">
  <div id="sidebarRoot"></div>
  <div class="main">
    <div id="topbarRoot"></div>
    <div class="view active">
      <div class="view-head">
        <div><h1>Prompt Library</h1><p>Reusable AI prompt templates to generate on-brand replies fast.</p></div>
      </div>
      <div id="subnavRoot"></div>

      <div style="margin-bottom:1.2rem;">
        <input class="search" style="width:280px;" placeholder="Search by title or category..." id="promptSearch" />
      </div>

      <div class="grid-3" id="promptGrid"></div>
      <div id="promptEmptyState"></div>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/shell.js"></script>
<script>
  AsheShell.mount({ active:'inbox', search:false });
  document.getElementById('subnavRoot').outerHTML = AsheShell.subnavHtml('inbox', 'prompt-library.html');

  const D = window.ASHEFLOW_DATA;
  let searchTerm = '';

  function promptCardHtml(p){
    return `<div class="card card-hover">
      <div class="mini-tag">${p.category}</div>
      <div style="font-weight:700;font-size:.92rem;margin:.6rem 0 .5rem;">${p.title}</div>
      <div style="font-size:.85rem;color:var(--text-dim);line-height:1.55;margin-bottom:1rem;">${p.prompt}</div>
      <button class="btn btn-secondary btn-sm w-full" onclick="usePrompt(${JSON.stringify(p.prompt)}, this)">Use This Prompt</button>
    </div>`;
  }

  function renderPrompts(){
    const q = searchTerm.toLowerCase();
    const list = D.promptLibrary.filter(p=>!q || p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
    const grid = document.getElementById('promptGrid');
    const empty = document.getElementById('promptEmptyState');
    if(!list.length){
      grid.innerHTML = '';
      empty.innerHTML = `<div class="state-block"><div class="state-icon">🔍</div><h3>No prompts found</h3><p>Try a different search term.</p></div>`;
      return;
    }
    empty.innerHTML = '';
    grid.innerHTML = list.map(p=>promptCardHtml(p)).join('');
  }

  function usePrompt(text, btn){
    AsheUtils.copyText(text, btn);
    AsheToast.show({type:'success', title:'Prompt copied — paste it into AI Inbox'});
  }

  renderPrompts();
  document.getElementById('promptSearch').addEventListener('input', e=>{ searchTerm = e.target.value; renderPrompts(); });
</script>
<script src="assets/js/copilot.js" data-context="dashboard"></script>
</body>
</html>
