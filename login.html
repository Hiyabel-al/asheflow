<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AsheFlow Login</title>
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-box">
  <div class="logo">ASHEFLOW</div>
  <p>Creator Command Center</p>

  <input type="email" placeholder="Creator email" id="email">
  <input type="password" placeholder="Password" id="password">

  <button onclick="login()">Enter Dashboard</button>

  <div class="small">
    New creator? Request access
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
